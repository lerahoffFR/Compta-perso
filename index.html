<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0c14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mes Finances</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
:root{
  --bg:#0a0c14;--card:#12151f;--card2:#1a1e2e;--border:#252a3d;
  --accent:#5b7fff;--accent2:#7c9fff;
  --green:#1db96e;--green2:#25e085;
  --red:#f04060;--orange:#f5a623;--purple:#9b6dff;--teal:#00c9a7;
  --text:#eef2ff;--sub:#7a85a3;--sub2:#4a5270;
  --nav-h:64px;--safe-b:env(safe-area-inset-bottom,0px);
  --radius:16px;--radius-s:10px;
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.header-left h1{font-size:16px;font-weight:700;letter-spacing:-.3px}
.header-left p{font-size:11px;color:var(--sub);margin-top:1px;text-transform:capitalize}
.header-save{background:var(--accent);border:none;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.header-save:active{transform:scale(.95);opacity:.85}
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 12px 20px}
.scroll-area::-webkit-scrollbar{display:none}
.nav{flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;z-index:20;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:8px 2px 7px;border:none;border-bottom:2px solid transparent;background:none;color:var(--sub2);font-family:inherit;transition:.15s}
.nav-item.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-item:active{opacity:.7}
.nav-icon{font-size:18px;line-height:1}
.nav-label{font-size:9px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.nav-dot{display:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.card-title{font-size:10px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi-card{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius-s);padding:12px 13px}
.kpi-card.wide{grid-column:span 2}
.kpi-label{font-size:10px;color:var(--sub);font-weight:500;margin-bottom:4px}
.kpi-val{font-size:22px;font-weight:700;line-height:1;letter-spacing:-.5px}
.kpi-val.sm{font-size:17px}
.kpi-val.green{color:var(--green2)}
.kpi-val.red{color:var(--red)}
.kpi-val.blue{color:var(--accent2)}
.kpi-val.purple{color:var(--purple)}
.kpi-val.orange{color:var(--orange)}
.kpi-sub{font-size:10px;color:var(--sub);margin-top:3px}
.prog-wrap{background:var(--border);border-radius:4px;height:5px;overflow:hidden;margin:8px 0 6px}
.prog-fill{height:100%;border-radius:4px;transition:width .4s ease}
.list-item{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);gap:10px}
.list-item:last-child{border-bottom:none}
.list-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.list-body{flex:1;min-width:0}
.list-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-meta{font-size:10px;color:var(--sub);margin-top:1px}
.list-right{text-align:right;flex-shrink:0}
.list-tag{font-size:9px;padding:2px 7px;border-radius:4px;font-weight:600;display:inline-block;margin-top:2px}
.tag-red{background:rgba(240,64,96,.18);color:var(--red)}
.tag-yellow{background:rgba(245,166,35,.18);color:var(--orange)}
.field{margin-bottom:10px}
.field label{font-size:11px;color:var(--sub);font-weight:500;display:block;margin-bottom:5px}
.field input,.field select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:var(--radius-s);font-size:14px;font-family:inherit;outline:none;-webkit-appearance:none;transition:.15s}
.field input:focus,.field select:focus{border-color:var(--accent);background:#1e2540}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:var(--radius-s);border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.96);opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-full{width:100%}
.inline-input{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:6px 9px;border-radius:8px;font-size:13px;font-family:'DM Mono',monospace;width:100%;outline:none;text-align:right}
.inline-input:focus{border-color:var(--accent)}
.chart-container{position:relative;height:160px;margin-top:8px}
.alloc-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.alloc-item:last-child{border-bottom:none}
.alloc-emoji{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.alloc-input{width:76px;background:var(--card2);border:1px solid var(--border);color:var(--accent);padding:5px 7px;border-radius:7px;font-size:12px;font-family:'DM Mono',monospace;font-weight:700;text-align:center;outline:none;flex-shrink:0}
.alloc-input:focus{border-color:var(--accent)}
.alloc-val{font-size:13px;font-weight:700;color:var(--accent2);min-width:62px;text-align:right;flex-shrink:0}
.invest-block{background:var(--card2);border-radius:var(--radius-s);padding:12px;margin-bottom:8px;border:1px solid var(--border)}
.invest-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.invest-name-input{flex:1;background:transparent;border:none;border-bottom:1px dashed var(--border);color:var(--text);font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;outline:none;padding:2px 0;min-width:0}
.invest-name-input:focus{border-bottom-color:var(--accent)}
.invest-pl{font-size:12px;font-weight:700;flex-shrink:0}
.section-lbl{font-size:10px;font-weight:700;color:var(--sub2);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 7px}
.section-lbl-row{display:flex;align-items:center;justify-content:space-between;margin:14px 0 7px}
.section-lbl-row .section-lbl{margin:0}
.total-bar{background:linear-gradient(90deg,rgba(91,127,255,.15),rgba(91,127,255,.05));border:1px solid rgba(91,127,255,.25);border-radius:var(--radius-s);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.total-bar-label{font-size:11px;font-weight:600;color:var(--sub)}
.total-bar-val{font-size:18px;font-weight:700;color:var(--accent2);letter-spacing:-.3px}
.entry-row{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px;margin-bottom:8px}
.entry-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.entry-row-title{font-size:12px;font-weight:700}
.entry-del{background:none;border:none;color:var(--sub2);font-size:18px;cursor:pointer;padding:2px 6px}
.entry-del:active{color:var(--red)}
.sub-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--sub);background:var(--card2);font-family:inherit;transition:.15s}
.sub-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:10px;transition:.2s;cursor:pointer}
.toggle input:checked+.toggle-slider{background:var(--green)}
.toggle-slider:before{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.toggle input:checked+.toggle-slider:before{transform:translateX(16px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.page{animation:fadeUp .2s ease}
.pie-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px}
.pie-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub)}
.pie-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rev-row{display:grid;grid-template-columns:1fr 1fr 32px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.rev-row:last-child{border-bottom:none}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--green);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:100;transition:transform .25s ease;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.del-btn-sm{background:none;border:none;color:var(--sub2);font-size:16px;cursor:pointer;padding:2px;line-height:1;flex-shrink:0}
.del-btn-sm:active{color:var(--red)}
.add-btn-mini{background:var(--card2);border:1px solid var(--border);color:var(--accent);padding:5px 11px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;flex-shrink:0}
.add-btn-mini:active{opacity:.7}
.livret-row{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius-s);padding:11px 12px;margin-bottom:8px}
.livret-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.livret-name-input{flex:1;background:transparent;border:none;border-bottom:1px dashed var(--border);color:var(--teal);font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;outline:none;padding:2px 0;min-width:0}
.livret-name-input:focus{border-bottom-color:var(--teal)}
.name-edit{background:transparent;border:none;border-bottom:1px dashed var(--border);color:var(--text);font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;outline:none;padding:2px 0;width:100%}
.name-edit:focus{border-bottom-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <h1>💼 Mes Finances</h1>
      <p id="date-header"></p>
    </div>
    <button class="header-save" onclick="saveData()">Sauvegarder</button>
  </div>
  <nav class="nav">
    <button class="nav-item active" onclick="goTo('dashboard',this)">
      <span class="nav-icon">⊞</span><span class="nav-label">Accueil</span><span class="nav-dot"></span>
    </button>
    <button class="nav-item" onclick="goTo('budget',this)">
      <span class="nav-icon">💳</span><span class="nav-label">Budget</span><span class="nav-dot"></span>
    </button>
    <button class="nav-item" onclick="goTo('depenses',this)">
      <span class="nav-icon">📋</span><span class="nav-label">Dépenses</span><span class="nav-dot"></span>
    </button>
    <button class="nav-item" onclick="goTo('invest',this)">
      <span class="nav-icon">📈</span><span class="nav-label">Invest</span><span class="nav-dot"></span>
    </button>
    <button class="nav-item" onclick="goTo('patrimoine',this)">
      <span class="nav-icon">🏦</span><span class="nav-label">Patrimoine</span><span class="nav-dot"></span>
    </button>
  </nav>
  <div class="scroll-area" id="page-content"></div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
const DEFAULT_STATE = {
  revenus:[
    {label:'Janvier',montant:3200},{label:'Février',montant:3180},
    {label:'Mars',montant:0},{label:'Avril',montant:0},{label:'Mai',montant:0},
    {label:'Juin',montant:0},{label:'Juillet',montant:0},{label:'Août',montant:0},
    {label:'Septembre',montant:0},{label:'Octobre',montant:0},
    {label:'Novembre',montant:0},{label:'Décembre',montant:0},
  ],
  depenses:[
    {nom:'Mutuelle',         montant:35,    date:'auto',obligatoire:true, cat:'Santé',    paye:true,actif:true},
    {nom:'Téléphone',        montant:25,    date:'auto',obligatoire:true, cat:'Télécom',  paye:true,actif:true},
    {nom:'Assurance voiture',montant:40,    date:'auto',obligatoire:true, cat:'Assurance',paye:true,actif:true},
    {nom:'YouTube Premium',  montant:12.99, date:'~28', obligatoire:false,cat:'Streaming',paye:true,actif:true},
    {nom:'ADN (anime)',      montant:6.99,  date:'~28', obligatoire:false,cat:'Streaming',paye:true,actif:true},
    {nom:'ChatGPT Plus',     montant:7.99,  date:'~28', obligatoire:false,cat:'IA',       paye:true,actif:true},
    {nom:'Twitch Sub 1',     montant:5,     date:'var.',obligatoire:false,cat:'Loisirs',  paye:true,actif:true},
    {nom:'Twitch Sub 2',     montant:5,     date:'var.',obligatoire:false,cat:'Loisirs',  paye:true,actif:true},
    {nom:'Twitch Sub 3',     montant:5,     date:'var.',obligatoire:false,cat:'Loisirs',  paye:true,actif:true},
    {nom:'Aide Maman',       montant:0,     date:'var.',obligatoire:true, cat:'Famille',  paye:false,actif:true},
    {nom:'Impôts (futur)',   montant:0,     date:'',    obligatoire:true, cat:'Impôts',   paye:false,actif:true},
  ],
  deplBudgetHebdo:350,
  deplBudgetBouffe:80,
  deplEntries:[],
  loisirsBudget:300,
  loisirsEntries:[],
  etfs:[{nom:'ETF (ex: MSCI World)',investi:0,valeur:0,actif:true}],
  cryptos:[{nom:'Bitcoin (BTC)',qte:0,prixMoyen:0,valeur:0,actif:true}],
  livrets:[{nom:'Livret A',solde:0,taux:3.0,actif:true},{nom:'Livret Jeune',solde:0,taux:4.0,actif:true}],
  compteDE:0,revolut:0,especes:0,
  revenusExtra:[
    // ex: {label:'Prime janvier', montant:0}
  ],
  depensesExtra:[],
  allocMode:'pct',
  allocations:[
    {dest:'ETF',        emoji:'📊',pct:30,eur:0},
    {dest:'Bitcoin',    emoji:'₿', pct:10,eur:0},
    {dest:'Livret A',   emoji:'🏦',pct:15,eur:0},
    {dest:'Livret Jeune',emoji:'⭐',pct:10,eur:0},
    {dest:'Gros Achat', emoji:'🚗',pct:20,eur:0},
    {dest:'Sécurité',   emoji:'🛡️',pct:10,eur:0},
    {dest:'Plaisir',    emoji:'🎉',pct:5, eur:0},
  ]
};

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let charts = {};
let currentPage = 'dashboard';

function loadData(){
  try{
    const s=localStorage.getItem('finances_v3');
    if(s){ const loaded=JSON.parse(s); state=deepMerge(JSON.parse(JSON.stringify(DEFAULT_STATE)),loaded); }
  }catch(e){}
}
function deepMerge(base,over){
  if(Array.isArray(over)) return over;
  if(typeof over!=='object'||!over) return over;
  const res=Object.assign({},base);
  for(const k of Object.keys(over)) res[k]=deepMerge(base[k],over[k]);
  return res;
}
function saveData(){
  try{ localStorage.setItem('finances_v3',JSON.stringify(state)); showToast('✅ Données sauvegardées !'); }
  catch(e){ showToast('❌ Erreur de sauvegarde'); }
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

const fmt  = v=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v||0);
const fmtd = v=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0);
const pct  = v=>(v*100).toFixed(1)+'%';
const clamp= (v,a,b)=>Math.min(b,Math.max(a,v));

function totalDepenses(){ return state.depenses.reduce((s,d)=>s+(d.actif!==false?(d.montant||0):0),0); }
function totalRevenusExtra(){ return (state.revenusExtra||[]).reduce((s,r)=>s+(r.montant||0),0); }
function totalDepensesExtra(){ return (state.depensesExtra||[]).reduce((s,d)=>s+(d.montant||0),0); }
function totalDeplPro(){   return state.deplEntries.reduce((s,e)=>s+(e.hotel||0)+(e.restoDepl||0),0); }
function totalDeplBouffe(){ return state.deplEntries.reduce((s,e)=>s+(e.nourriture||0),0); }
function totalDepl(){ return totalDeplPro()+totalDeplBouffe(); }
function totalLoisirs(){ return state.loisirsEntries.reduce((s,e)=>s+(e.montant||0),0); }
function salaireActuel(){
  const vals=state.revenus.filter(r=>r.montant>0);
  const salBase=vals.length?vals[vals.length-1].montant:0;
  return salBase+totalRevenusExtra();
}
function resteTotal(){ return salaireActuel()-totalDepenses()-totalDepl()-totalLoisirs()-totalDepensesExtra(); }
function totalEtfI()  { return state.etfs.reduce((s,e)=>s+(e.investi||0),0); }
function totalEtfV()  { return state.etfs.reduce((s,e)=>s+(e.valeur||0),0); }
function totalCryI()  { return state.cryptos.reduce((s,c)=>s+(c.qte||0)*(c.prixMoyen||0),0); }
function totalCryV()  { return state.cryptos.reduce((s,c)=>s+(c.valeur||0),0); }
function totalLivV()  { return state.livrets.reduce((s,l)=>s+(l.solde||0),0); }
function patrimoineTotal(){ return totalEtfV()+totalCryV()+totalLivV()+(state.compteDE||0)+(state.revolut||0)+(state.especes||0); }
function destroyCharts(){ Object.values(charts).forEach(c=>c.destroy()); charts={}; }

function goTo(page,el){
  destroyCharts(); currentPage=page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  render();
}

// Mémorise le sous-onglet actif par page
const activeSubTab = {};

// render() recrée la page entière (changement de page nav ou ajout/suppression)
// softRender() ne met à jour que le contenu du panneau actif (saisie montant, toggle…)
function render(){
  const c=document.getElementById('page-content');
  c.innerHTML='';
  const div=document.createElement('div');
  div.className='page';
  if(currentPage==='dashboard')   div.innerHTML=renderDashboard();
  else if(currentPage==='budget')     div.innerHTML=renderBudget();
  else if(currentPage==='depenses')   div.innerHTML=renderDepenses();
  else if(currentPage==='invest')     div.innerHTML=renderInvest();
  else if(currentPage==='patrimoine') div.innerHTML=renderPatrimoine();
  c.appendChild(div);
  // Restaure le sous-onglet mémorisé
  const saved=activeSubTab[currentPage];
  if(saved){
    const btn=document.querySelector(`.sub-tab[data-panel="${saved}"]`);
    if(btn) _applySubTab(saved,btn);
  }
  afterRender();
}

// Mise à jour douce : ne redessine que le panneau courant, sans toucher aux onglets
function softRender(){
  const panelId = activeSubTab[currentPage];
  if(!panelId){ render(); return; }
  const panel = document.getElementById(panelId);
  if(!panel){ render(); return; }
  // Regénère uniquement le contenu du panneau actif
  const html = _panelHTML(currentPage, panelId);
  if(html===null){ render(); return; }
  // Mémorise la position de scroll
  const scrollArea = document.querySelector('.scroll-area');
  const scrollTop  = scrollArea ? scrollArea.scrollTop : 0;
  panel.innerHTML = html;
  if(scrollArea) scrollArea.scrollTop = scrollTop;
  afterRender();
}

// Retourne le HTML d'un panneau donné, null si non géré
function _panelHTML(page, panelId){
  if(page==='depenses'){
    if(panelId==='dep-fixes')    return _depFixes();
    if(panelId==='dep-extra')    return _depExtra();
    if(panelId==='dep-depl')     return _depDeplacements();
    if(panelId==='dep-loisirs')  return _depLoisirs();
  }
  if(page==='budget'){
    if(panelId==='rev-sub')   return _revenusSub();
    if(panelId==='extra-sub') return _revenusExtraSub();
    if(panelId==='rep-sub')   return _repartitionSub(resteTotal());
  }
  if(page==='invest'){
    if(panelId==='inv-etf')     return _etfs();
    if(panelId==='inv-crypto')  return _cryptos();
    if(panelId==='inv-livrets') return _livrets();
  }
  if(page==='patrimoine') return null; // toujours render complet
  return null;
}

// ── DASHBOARD ──────────────────────────────────────────
function renderDashboard(){
  const sal=salaireActuel();
  const depTotal=totalDepenses()+totalDepl()+totalLoisirs()+totalDepensesExtra();
  const reste=sal-depTotal;
  const capInvest=Math.max(0,reste-200);

// ── AFTER RENDER (graphiques) ──────────────────────────
function afterRender(){
  if(currentPage==='dashboard'){
    const dep=totalDepenses(),depl=totalDepl(),lois=totalLoisirs();
    const canvas=document.getElementById('chartDep');
    if(canvas&&(dep||depl||lois)){
      const labels=['Fixes','Déplacements','Loisirs'];
      const data=[dep,depl,lois];
      const colors=['#f04060','#5b7fff','#9b6dff'];
      charts.dep=new Chart(canvas,{type:'doughnut',
        data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0,hoverOffset:6}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:'68%',
          plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmt(ctx.parsed)}}}}});
      const leg=document.getElementById('pie-legend-dep');
      if(leg) leg.innerHTML=labels.map((l,i)=>`<div class="pie-legend-item"><div class="pie-legend-dot" style="background:${colors[i]}"></div>${l}: ${fmt(data[i])}</div>`).join('');
    }
  }
  if(currentPage==='patrimoine'){
    const canvas=document.getElementById('chartPie');
    if(canvas){
      const poches=[
        {nom:'Compte CE',v:state.compteDE,c:'#3b82f6',actif:true},{nom:'Revolut',v:state.revolut,c:'#6366f1',actif:true},
        {nom:'ETF',v:totalEtfV(),c:'#a855f7',actif:true},{nom:'Crypto',v:totalCryV(),c:'#f59e0b',actif:true},
        {nom:'Livrets',v:totalLivV(),c:'#22c55e',actif:true},{nom:'Espèces',v:state.especes||0,c:'#94a3b8',actif:true},
      ].filter(p=>p.v>0);
      if(poches.length){
        charts.pie=new Chart(canvas,{type:'doughnut',
          data:{labels:poches.map(p=>p.nom),datasets:[{data:poches.map(p=>p.v),backgroundColor:poches.map(p=>p.c),borderWidth:0,hoverOffset:6}]},
          options:{responsive:true,maintainAspectRatio:false,cutout:'55%',
            plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmt(ctx.parsed)+' ('+pct(ctx.parsed/patrimoineTotal())+')'}}}}});
        const leg=document.getElementById('pie-legend-pat');
        if(leg) leg.innerHTML=poches.map(p=>`<div class="pie-legend-item"><div class="pie-legend-dot" style="background:${p.c}"></div>${p.nom}: ${fmt(p.v)}</div>`).join('');
      }
    }
  }
}

// ── SOUS-ONGLETS ───────────────────────────────────────
// Applique visuellement un sous-onglet sans déclencher de render
function _applySubTab(id, btn){
  if(!btn) return;
  btn.closest('.sub-tabs').querySelectorAll('.sub-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const parent=btn.closest('.sub-tabs').parentElement;
  parent.querySelectorAll(':scope>[id]').forEach(p=>{
    p.style.display = p.id===id ? '' : 'none';
  });
}

// Appelé par l'utilisateur en tapant sur un onglet
function switchSubTab(id,btn){
  activeSubTab[currentPage] = id;  // mémorise
  _applySubTab(id, btn);
}

// Migration : ajoute les nouvelles allocations si absentes du localStorage
function migrateState(){
  const needed = [
    {dest:'Livret Jeune', emoji:'⭐', pct:10, eur:0},
    {dest:'Gros Achat',   emoji:'🚗', pct:20, eur:0},
  ];
  needed.forEach(n=>{
    const exists = state.allocations.some(a=>a.dest===n.dest);
    if(!exists) state.allocations.push(n);
  });
}
loadData();
migrateState();
document.getElementById('date-header').textContent =
  new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
render();
setInterval(saveData,60000);
</script>
